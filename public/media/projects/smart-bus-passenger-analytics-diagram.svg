<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Smart Bus Passenger Analytics System workflow diagram</title>
  <desc id="desc">Workflow from bus door sensors to ESP32 processing, local server storage, and analytics for passenger counts, GPS context, fuel usage, and gain/loss prediction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#0f766e"/>
    </marker>
    <style>
      .title { font: 800 46px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 22px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .label { font: 800 24px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .body { font: 500 18px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .small { font: 700 16px Inter, Segoe UI, Arial, sans-serif; fill: #0f766e; }
      .whiteTitle { font: 800 27px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .whiteBody { font: 500 18px Inter, Segoe UI, Arial, sans-serif; fill: #dbeafe; }
      .card { fill: #ffffff; stroke: #dbe3ee; stroke-width: 2; filter: url(#shadow); }
      .pill { fill: #ecfdf5; stroke: #99f6e4; stroke-width: 2; }
      .arrow { fill: none; stroke: #0f766e; stroke-width: 5; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1430" cy="110" r="150" fill="#dbeafe" opacity="0.55"/>
  <circle cx="130" cy="780" r="190" fill="#ccfbf1" opacity="0.55"/>

  <text x="80" y="86" class="title">Smart Bus Passenger Analytics System</text>
  <text x="80" y="124" class="subtitle">ESP32 sensor boxes for passenger counts, GPS context, local storage, and route profitability analysis</text>
  <rect x="80" y="152" width="365" height="42" rx="21" class="pill"/>
  <text x="104" y="180" class="small">Private freelance IoT project - source code remains client-owned</text>

  <rect x="84" y="248" width="308" height="380" rx="26" fill="url(#navy)" filter="url(#shadow)"/>
  <rect x="130" y="310" width="216" height="234" rx="18" fill="#f97316"/>
  <rect x="158" y="360" width="160" height="110" rx="10" fill="#111827"/>
  <rect x="179" y="382" width="118" height="66" rx="5" fill="#1d4ed8"/>
  <circle cx="146" cy="568" r="18" fill="#22c55e"/>
  <circle cx="332" cy="568" r="18" fill="#ef4444"/>
  <text x="128" y="683" class="whiteTitle">Bus Door Area</text>
  <text x="128" y="721" class="whiteBody">Two sensor boxes mount near</text>
  <text x="128" y="747" class="whiteBody">the entry/exit point.</text>

  <rect x="480" y="220" width="330" height="160" rx="22" class="card"/>
  <text x="520" y="270" class="label">Sensors</text>
  <text x="520" y="312" class="body">Laser: crossing detection</text>
  <text x="520" y="342" class="body">Sound: event context</text>
  <text x="520" y="372" class="body">GPS: time and location</text>

  <rect x="480" y="520" width="330" height="160" rx="22" class="card"/>
  <text x="520" y="570" class="label">Local Status Screen</text>
  <text x="520" y="612" class="body">Shows online/offline state</text>
  <text x="520" y="642" class="body">and basic device feedback.</text>

  <rect x="900" y="220" width="330" height="160" rx="22" class="card"/>
  <text x="940" y="270" class="label">ESP32 Processing</text>
  <text x="940" y="312" class="body">Filters sensor signals into</text>
  <text x="940" y="342" class="body">entry and exit events.</text>

  <rect x="900" y="520" width="330" height="160" rx="22" class="card"/>
  <text x="940" y="570" class="label">Local Server</text>
  <text x="940" y="612" class="body">Stores passenger events,</text>
  <text x="940" y="642" class="body">timestamps, and GPS context.</text>

  <rect x="1310" y="340" width="230" height="220" rx="28" fill="#0f766e" filter="url(#shadow)"/>
  <text x="1350" y="392" class="whiteTitle">Analytics</text>
  <text x="1350" y="438" class="whiteBody">Passenger totals</text>
  <text x="1350" y="468" class="whiteBody">Route activity</text>
  <text x="1350" y="498" class="whiteBody">Fuel usage</text>
  <text x="1350" y="528" class="whiteBody">Gain/loss prediction</text>

  <path class="arrow" d="M392 348 C420 348 440 300 480 300"/>
  <path class="arrow" d="M810 300 L900 300"/>
  <path class="arrow" d="M1065 380 L1065 520"/>
  <path class="arrow" d="M1230 600 C1282 600 1270 450 1310 450"/>
  <path class="arrow" d="M392 528 C430 528 438 600 480 600"/>
  <path class="arrow" d="M810 600 L900 600"/>

  <rect x="83" y="794" width="1434" height="58" rx="20" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
  <text x="118" y="830" class="body">Portfolio-safe summary: approved photos and architecture only. No client code, credentials, database schema, or deployment details are public.</text>
</svg>
